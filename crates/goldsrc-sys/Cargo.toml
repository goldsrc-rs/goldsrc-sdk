[package]
name = "goldsrc-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Raw FFI bindings for GoldSrc engine and Metamod (generated via bindgen)"
links = "goldsrc"

[build-dependencies]
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

