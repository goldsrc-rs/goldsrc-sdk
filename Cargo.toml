[workspace]
members = [
    "crates/goldsrc-sys",
    "crates/goldsrc-spi",
    "crates/goldsrc-api",
    "crates/goldsrc-macros",
    "crates/goldsrc",
    "examples/test_chat",
    "examples/test_ecs",
    "examples/test_hud",
    "examples/test_i18n",
    "examples/test_menu",
]
default-members = [
    "crates/goldsrc-sys",
    "crates/goldsrc-spi",
    "crates/goldsrc-api",
    "crates/goldsrc-macros",
    "crates/goldsrc",
]
resolver = "3"

[workspace.package]
version = "0.20.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "Pure Rust guest SDK and framework for writing GoldSrc.rs WebAssembly plugins"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc-sdk"

[workspace.dependencies]
goldsrc-sys = { path = "crates/goldsrc-sys", version = "0.20.0" }
goldsrc = { path = "crates/goldsrc", version = "0.20.0" }
goldsrc-api = { path = "crates/goldsrc-api", version = "0.20.0" }
goldsrc-spi = { path = "crates/goldsrc-spi", version = "0.20.0" }
goldsrc-macros = { path = "crates/goldsrc-macros", version = "0.20.0" }

wit-bindgen = "0.63.0"
crossbeam-channel = "0.5"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
toml = "1.1"
log = "0.4.33"
stitch-core = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main", default-features = false }
stitch-macros = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main" }

[profile.dev]
opt-level = 0
debug = 1
overflow-checks = true

[profile.release]
lto = "thin"
opt-level = "z"
strip = "debuginfo"
panic = "abort"
codegen-units = 1
overflow-checks = true
