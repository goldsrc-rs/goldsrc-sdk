[workspace]
members = [
    "goldsrc-sys",
    "goldsrc-spi",
    "goldsrc-api",
    "goldsrc-macros",
    "goldsrc",
    "examples/test_chat",
    "examples/test_ecs",
    "examples/test_hud",
    "examples/test_i18n",
    "examples/test_menu",
]
default-members = [
    "goldsrc-sys",
    "goldsrc-spi",
    "goldsrc-api",
    "goldsrc-macros",
    "goldsrc",
]
resolver = "3"

[workspace.package]
version = "0.20.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "Pure Rust guest SDK and framework for writing GoldSrc.rs WebAssembly plugins"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc-sdk"

[workspace.dependencies]
goldsrc-sys = { path = "goldsrc-sys", version = "0.20.0" }
goldsrc = { path = "goldsrc", version = "0.20.0" }
goldsrc-api = { path = "goldsrc-api", version = "0.20.0" }
goldsrc-spi = { path = "goldsrc-spi", version = "0.20.0" }
goldsrc-macros = { path = "goldsrc-macros", version = "0.20.0" }

wit-bindgen = "0.62.0"
crossbeam-channel = "0.5"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
toml = "1.1"
thiserror = "2.0"
log = "0.4.33"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
lto = "thin"
opt-level = "z"
strip = "debuginfo"
codegen-units = 16
